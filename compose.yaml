version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: piston_protocol_db
    restart: always
    environment:
      POSTGRES_DB: piston_protocol_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: