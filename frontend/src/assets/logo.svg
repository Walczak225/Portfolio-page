<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Główne tło pasujące do interfejsu -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
    
    <!-- Metaliczny gradient dla tłoka i obudowy -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="50%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>

    <!-- Subtelna poświata w stylu UI -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Tło nawiązujące do panelu logowania -->
  <rect width="500" height="500" rx="40" fill="url(#bgGlow)" />

  <!-- Zewnętrzny minimalistyczny pierścień / cykl protokołu -->
  <circle cx="250" cy="250" r="160" fill="none" stroke="#1f2937" stroke-width="4" stroke-dasharray="12 6" />
  <circle cx="250" cy="250" r="140" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4" filter="url(#neonGlow)" />

  <!-- Geometria tłoka (Piston) -->
  <g transform="translate(0, 5)">
    <!-- Korbowód (Protokół / Połączenie) -->
    <path d="M 230 310 L 235 410 L 265 410 L 270 310 Z" fill="url(#metalGrad)" opacity="0.9" />
    <circle cx="250" cy="360" r="12" fill="#07090e" stroke="url(#metalGrad)" stroke-width="4" />

    <!-- Główna główka tłoka -->
    <path d="M 180 180 
             C 180 165, 200 155, 250 155 
             C 300 155, 320 165, 320 180 
             L 320 290 
             C 320 305, 305 315, 290 315 
             L 210 315 
             C 195 315, 180 305, 180 290 Z" 
          fill="none" stroke="url(#metalGrad)" stroke-width="8" stroke-linejoin="round" />

    <!-- Pierścienie uszczelniające tłoka (JDM Style Red Accent na pierwszym) -->
    <line x1="188" y1="205" x2="312" y2="205" stroke="#ef4444" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)" />
    <line x1="192" y1="225" x2="308" y2="225" stroke="url(#metalGrad)" stroke-width="3" stroke-linecap="round" />
    <line x1="192" y1="242" x2="308" y2="242" stroke="url(#metalGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- Sworzeń tłoka (detal geometryczny) -->
    <circle cx="250" cy="275" r="16" fill="#07090e" stroke="url(#metalGrad)" stroke-width="5" />
  </g>

  <!-- Cyfrowy akcent "Protocol" (subtelne węzły sieciowe w rogach) -->
  <circle cx="100" cy="100" r="3" fill="#3b82f6" opacity="0.6" />
  <circle cx="400" cy="100" r="3" fill="#3b82f6" opacity="0.6" />
  <circle cx="100" cy="400" r="3" fill="#3b82f6" opacity="0.6" />
  <circle cx="400" cy="400" r="3" fill="#3b82f6" opacity="0.6" />
</svg>
